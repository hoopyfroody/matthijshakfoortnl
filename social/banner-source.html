<!doctype html>
<meta charset="utf-8">
<style>
  html { font-size: 8px; }
  body {
    margin: 0; width: 1584px; height: 396px; overflow: hidden;
    background: #14120f; position: relative;
  }
  .tetris-parallax {
    position: absolute; inset: -14vh 0; overflow: hidden;
    transform: translate3d(0, 12vh, 0);
  }
  .tetris-background {
    --grid-step: 5rem;
    --tile-size: 80rem;
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgb(36 158 232 / var(--line-alpha)) 1px, transparent 1px),
      linear-gradient(90deg, rgb(36 158 232 / var(--line-alpha)) 1px, transparent 1px);
    background-size: var(--grid-step) var(--grid-step);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 100%);
    mask-image: linear-gradient(to right, transparent, #000 18%, #000 100%);
  }
  .tetromino-field { position: absolute; inset: 0; }
  .tetromino-tile { position: absolute; top: var(--tile-top); left: var(--tile-left); width: var(--tile-size); height: var(--tile-size); }
  .tetromino-piece { position: absolute; top: var(--top); left: var(--left); opacity: var(--piece-opacity); }
  .tetromino-cell {
    position: absolute; top: var(--cell-top); left: var(--cell-left);
    width: var(--grid-step); height: var(--grid-step);
    border: 1px solid rgb(36 158 232 / var(--cell-border-alpha));
    background: rgb(36 158 232 / var(--cell-fill-alpha));
  }
  .logo { position: absolute; z-index: 1; right: 16rem; top: 50%; transform: translateY(-50%); width: 62rem; }
  body.plain .logo { display: none; }
</style>

<script>
const params = new URLSearchParams(location.search);
const lineAlpha = params.get("line") || "13%";
const borderAlpha = params.get("border") || "30%";
const fillAlpha = params.get("fill") || "2%";
const opacityBase = Number(params.get("opacity") || 0.3);
const opacityStep = Number(params.get("step") || 0.08);
if (params.get("logo") === "0") document.body.classList.add("plain");
document.body.style.setProperty("--line-alpha", lineAlpha);
document.body.style.setProperty("--cell-border-alpha", borderAlpha);
document.body.style.setProperty("--cell-fill-alpha", fillAlpha);

const GRID_STEP_REM = 5;
const TILE_SIZE_REM = 80;
const tetrominoes = {
  I: [[0,0],[1,0],[2,0],[3,0]],
  J: [[1,0],[1,1],[1,2],[0,2]],
  L: [[0,0],[0,1],[0,2],[1,2]],
  O: [[0,0],[1,0],[0,1],[1,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  T: [[0,0],[1,0],[2,0],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
};
const placements = [["O",2,3],["T",8,2],["L",13,4],["S",4,8],["I",10,11],["J",6,13],["Z",13,13]];
const parallax = document.createElement("div");
const background = document.createElement("div");
const field = document.createElement("div");
parallax.className = "tetris-parallax";
background.className = "tetris-background";
field.className = "tetromino-field";
for (let tileRow = -1; tileRow <= 1; tileRow += 1) {
  for (let tileColumn = -1; tileColumn <= 1; tileColumn += 1) {
    const tile = document.createElement("div");
    tile.className = "tetromino-tile";
    tile.style.setProperty("--tile-left", `${tileColumn * TILE_SIZE_REM}rem`);
    tile.style.setProperty("--tile-top", `${tileRow * TILE_SIZE_REM}rem`);
    placements.forEach(([shape, column, row], index) => {
      const piece = document.createElement("div");
      piece.className = "tetromino-piece";
      piece.style.setProperty("--left", `${column * GRID_STEP_REM}rem`);
      piece.style.setProperty("--top", `${row * GRID_STEP_REM}rem`);
      piece.style.setProperty("--piece-opacity", `${opacityBase + (index % 3) * opacityStep}`);
      tetrominoes[shape].forEach(([cellColumn, cellRow]) => {
        const cell = document.createElement("span");
        cell.className = "tetromino-cell";
        cell.style.setProperty("--cell-left", `${cellColumn * GRID_STEP_REM}rem`);
        cell.style.setProperty("--cell-top", `${cellRow * GRID_STEP_REM}rem`);
        piece.append(cell);
      });
      tile.append(piece);
    });
    field.append(tile);
  }
}
background.append(field);

parallax.append(background);
document.body.prepend(parallax);
// With ?clear=<padding-px>, move any piece that overlaps the logo box to the
// nearest free grid position, so the logo sits in open space.
const clearPadding = params.get("clear");
if (clearPadding !== null && !document.body.classList.contains("plain")) {
  const pad = Number(clearPadding) || 0;
  const logo = document.querySelector(".logo");
  const box = logo.getBoundingClientRect();
  const zone = {
    left: box.left - pad,
    right: box.right + pad,
    top: box.top - pad,
    bottom: box.bottom + pad,
  };
  const step = 40;
  const canvas = document.body.getBoundingClientRect();
  const cellsOf = (piece) =>
    [...piece.children].map((cell) => cell.getBoundingClientRect());
  const overlaps = (rects, area) =>
    rects.some(
      (r) =>
        r.right > area.left &&
        r.left < area.right &&
        r.bottom > area.top &&
        r.top < area.bottom,
    );

  const pieces = [...field.querySelectorAll(".tetromino-piece")];
  const clashing = pieces.filter((piece) => overlaps(cellsOf(piece), zone));
  const settled = pieces.filter((piece) => !clashing.includes(piece));

  // Slide each clashing piece along the grid to the nearest spot that clears
  // the logo, the canvas edges, and every piece already placed.
  clashing.forEach((piece) => {
    const start = cellsOf(piece);
    const width = Math.max(...start.map((r) => r.right)) - Math.min(...start.map((r) => r.left));
    const height = Math.max(...start.map((r) => r.bottom)) - Math.min(...start.map((r) => r.top));
    const candidates = [];
    for (let dx = -20; dx <= 20; dx += 1) {
      for (let dy = -20; dy <= 20; dy += 1) {
        candidates.push([dx * step, dy * step, Math.hypot(dx, dy)]);
      }
    }
    candidates.sort((a, b) => a[2] - b[2]);
    const spot = candidates.find(([dx, dy]) => {
      const moved = start.map((r) => ({
        left: r.left + dx,
        right: r.right + dx,
        top: r.top + dy,
        bottom: r.bottom + dy,
      }));
      const left = Math.min(...moved.map((r) => r.left));
      const top = Math.min(...moved.map((r) => r.top));
      if (left < step || top < step) return false;
      if (left + width > canvas.width - step) return false;
      if (top + height > canvas.height - step) return false;
      if (overlaps(moved, zone)) return false;
      return !settled.some((other) =>
        cellsOf(other).some((r) =>
          overlaps(moved, {
            left: r.left - step / 2,
            right: r.right + step / 2,
            top: r.top - step / 2,
            bottom: r.bottom + step / 2,
          }),
        ),
      );
    });
    if (!spot) {
      piece.remove();
      return;
    }
    piece.style.left = `calc(${piece.style.getPropertyValue("--left")} + ${spot[0]}px)`;
    piece.style.top = `calc(${piece.style.getPropertyValue("--top")} + ${spot[1]}px)`;
    settled.push(piece);
  });
}

</script>
